# HTTP → HTTPS yo'naltirish (mikrofon/kamera HTTPS talab qiladi)
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS asosiy server bloki
server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;
    root /var/www/acsess;
    index index.php index.html;
    charset utf-8;

    # SSL sertifikatlar (Let's Encrypt)
    # sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logs
    access_log /var/log/nginx/acsess_access.log;
    error_log  /var/log/nginx/acsess_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Mikrofon va kamera ruxsatini berish (getUserMedia ishlashi uchun SHART)
    add_header Permissions-Policy "camera=*, microphone=*" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # .env va yashirin fayllarni himoya qilish
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }

    # tmp, debug va audit fayllarni bloklash
    location ~ ^/tmp/ {
        deny all;
        return 404;
    }

    # Katta fayllarni yuklashga ruxsat
    client_max_body_size 100M;
}
